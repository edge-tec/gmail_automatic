# aaPanel Nginx VirtualHost Configuration for Gmail Automation
# Place this in aaPanel > Website > Conf or /www/server/panel/vhost/nginx/your-domain.com.conf

server {
    listen 80;
    listen 443 ssl http2;
    server_name mailautomation.example.com; # Replace with your actual domain
    index index.php index.html index.htm;
    root /www/wwwroot/mailautomation.example.com/public; # Note the /public document root!

    # SSL Configuration (Generated via aaPanel Let's Encrypt SSL)
    # ssl_certificate    /www/server/panel/vhost/cert/mailautomation.example.com/fullchain.pem;
    # ssl_certificate_key    /www/server/panel/vhost/cert/mailautomation.example.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;

    # Force HTTPS
    # if ($server_port !~ 443){
    #     rewrite ^(/.*)$ https://$host$1 permanent;
    # }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    charset utf-8;

    # URL Rewrite for Front Controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Deny access to sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ ^/(storage|database|app|config|views)/ {
        deny all;
        return 404;
    }

    # PHP-FPM configuration (Adjust PHP version if needed, e.g. php-82 / php-83)
    location ~ \.php$ {
        fastcgi_pass unix:/tmp/php-cgi-82.sock; # aaPanel PHP 8.2 sock or 127.0.0.1:9000
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS $https if_not_empty;
    }

    access_log /www/wwwlogs/mailautomation.example.com.log;
    error_log /www/wwwlogs/mailautomation.example.com.error.log;
}
