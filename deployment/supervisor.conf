# 1. Real-time Email Queue Workers (Auto-replies, Follow-ups, SMTP Notifications)
[program:gmail-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /www/wwwroot/your-domain.com/worker.php --queue-only
autostart=true
autorestart=true
user=www
numprocs=2
redirect_stderr=true
stdout_logfile=/www/wwwroot/your-domain.com/storage/logs/worker-queue.log
stopwaitsecs=3600

# 2. Dedicated Bulk Email Campaign Worker (Independent throughput for 20-50+ users)
[program:gmail-campaign-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /www/wwwroot/your-domain.com/worker.php --campaign-only
autostart=true
autorestart=true
user=www
numprocs=1
redirect_stderr=true
stdout_logfile=/www/wwwroot/your-domain.com/storage/logs/worker-campaign.log
stopwaitsecs=3600

