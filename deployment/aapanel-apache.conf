<VirtualHost *:80>
    ServerName mailautomation.example.com
    DocumentRoot /www/wwwroot/mailautomation.example.com/public

    <Directory /www/wwwroot/mailautomation.example.com/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /www/wwwlogs/mailautomation.example.com_error.log
    CustomLog /www/wwwlogs/mailautomation.example.com_access.log combined
</VirtualHost>
